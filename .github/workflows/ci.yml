name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/approvline
      # CI's Postgres is a single throwaway service container with no
      # PgBouncer in front of it - DIRECT_URL only exists in production to
      # bypass Supabase's pooler for migrations (see prisma/schema.prisma's
      # directUrl), so here it's simply the same connection as DATABASE_URL.
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/approvline
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test — production hardening
        run: npm run test:production-hardening
      - name: Test — founder console
        run: npm run test:founder
      - name: Test — founder provisioning
        run: npm run test:founder-provisioning
      - name: Test — customer health
        run: npm run test:customer-health
      - name: Test — onboarding pipeline
        run: npm run test:onboarding-pipeline
      - name: Test — go-live readiness
        run: npm run test:go-live-readiness
      - name: Test — feature management
        run: npm run test:features
      - name: Test — integration catalog
        run: npm run test:integrations
      - name: Test — customer integrations
        run: npm run test:customer-integrations
      - name: Test — plans and billing
        run: npm run test:billing
      - name: Test — shared Founder drawer
        run: npm run test:founder-drawer
      - name: Test — seats and usage
        run: npm run test:seats
      - name: Test — revenue
        run: npm run test:revenue
      - name: Test — support and notes
        run: npm run test:support-notes
      - name: Test — customer activity
        run: npm run test:customer-activity
      - name: Test — system health
        run: npm run test:system-health
      - name: Test — integration health
        run: npm run test:integration-health
      - name: Test — background jobs
        run: npm run test:background-jobs
      - name: Test — observability
        run: npm run test:observability
      - name: Test — founder audit logs
        run: npm run test:audit-logs
      - name: Test — founder security
        run: npm run test:security
      - name: Test — OAuth state-signing fail-closed
        run: npm run test:oauth-state-signing
      - name: Test — founder demo generator
        run: npm run test:demo-generator
      - name: Test — gateway entitlement enforcement
        run: npm run test:gateway-entitlement
      - name: Test — reliability hardening
        run: npm run test:reliability
      - name: Test — tenant isolation
        run: npm run test:tenant-isolation
      - name: Test — RBAC
        run: npm run test:rbac
      - name: Test — certification
        run: npm run test:certification
      - name: Test — approval detail (View Full Approval)
        run: npm run test:approval-detail
      - name: Test — approval detail render (defensive null-relation regression)
        run: npm run test:approval-detail-render
      - name: Test — approval detail drawer render (defensive optional-data regression)
        run: npm run test:approval-detail-drawer
      - name: Test — approvals redesign (canonical service, tenant isolation, no fake data)
        run: npm run test:approvals-redesign
      - name: Test — manual approvals
        run: npm run test:manual-approvals
      - name: Test — evidence platform
        run: npm run test:evidence
      - name: Test — approval records dashboard
        run: npm run test:approval-records
      - name: Test — Action Center
        run: npm run test:action-center
      - name: Build
        run: npm run build
      - name: Dependency audit gate
        run: npm run audit:ci
