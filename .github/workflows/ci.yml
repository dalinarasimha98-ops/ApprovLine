name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/approvline
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test — production hardening
        run: npm run test:production-hardening
      - name: Test — founder console
        run: npm run test:founder
      - name: Test — reliability hardening
        run: npm run test:reliability
      - name: Test — tenant isolation
        run: npm run test:tenant-isolation
      - name: Test — production certification
        run: npm run test:certification
      - name: Build
        run: npm run build
      - name: Dependency audit gate
        run: npm run audit:ci
